<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada | URIPEL</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#25336b">
<link rel="icon" href="/img/favicon.png" sizes="512x512" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#25336b;--navy-dark:#1a2450;--ink:#151d2e;--body:#4d576c;--line:#e0e5f0;--soft:#f5f7fc;--accent:#0f8fa6}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--soft);color:var(--body);line-height:1.65;text-align:center}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(21,29,46,.08);padding:clamp(32px,6vw,52px);max-width:520px}
img{height:24px;width:auto;margin:0 auto 26px;display:block}
.code{font-size:.78rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
h1{color:var(--ink);font-size:1.6rem;letter-spacing:-.02em;margin:0 0 12px}
p{margin:0 0 26px}
.btn{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-weight:600;font-size:.97rem;
  padding:14px 26px;border-radius:10px;background:var(--navy);color:#fff;text-decoration:none;transition:background .2s}
.btn:hover{background:var(--navy-dark)}
a:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
  <div class="box">
    <img src="/img/logo.webp" width="573" height="110" alt="URIPEL">
    <div class="code">Error 404</div>
    <h1>No encontramos esta página</h1>
    <p>Puede que el enlace esté desactualizado o que la dirección tenga un error.</p>
    <a class="btn" href="/">Ir al inicio</a>
  </div>
</body>
</html>
